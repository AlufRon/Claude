# Configuration for Protein LLaDA ~500M parameters
# Adapted for protein inverse folding with masked diffusion

model:
  name: "ProteinLLaDA-500M"

  # Architecture parameters (scaled down from 8B)
  vocab_size: 25  # 20 amino acids + 5 special tokens
  hidden_size: 768  # Reduced from 4096
  num_hidden_layers: 12  # Reduced from 32
  num_attention_heads: 12  # Reduced from 32
  intermediate_size: 3072  # 4 * hidden_size

  # Position encoding
  max_position_embeddings: 1024  # Max protein length

  # Dropout
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1

  # Layer norm
  layer_norm_eps: 1.0e-12

  # Activation
  hidden_act: "gelu"

  # Initialization
  initializer_range: 0.02

# Masked diffusion parameters
diffusion:
  # Masking strategy
  min_mask_ratio: 0.0  # Variable masking from 0 to 1
  max_mask_ratio: 1.0

  # Inference parameters
  num_inference_steps: 10  # Iterative unmasking steps
  confidence_threshold: 0.9  # Keep predictions above this confidence

  # Remasking strategy
  remask_strategy: "confidence"  # Options: "confidence", "random", "hybrid"
  remask_ratio: 0.3  # Fraction to remask in each iteration

# Training parameters
training:
  # Optimizer
  learning_rate: 5.0e-5
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # Learning rate schedule
  lr_scheduler_type: "cosine"
  warmup_steps: 1000

  # Training dynamics
  batch_size: 16
  gradient_accumulation_steps: 4  # Effective batch size = 64
  num_train_epochs: 20

  # Mixed precision
  fp16: true

  # Logging
  logging_steps: 100
  eval_steps: 500
  save_steps: 1000

  # Hybrid loss weights
  alpha_masking: 0.7  # Weight for masked token prediction
  beta_folding: 0.3  # Weight for structure consistency (RMSD)

# Data parameters
data:
  # Dataset paths
  train_data: "data/cath42/train"
  val_data: "data/cath42/validation"
  test_data: "data/cath42/test"

  # Preprocessing
  max_seq_length: 512  # Maximum protein sequence length
  min_seq_length: 30   # Minimum protein sequence length

  # Augmentation
  use_augmentation: true
  mutation_rate: 0.05  # Random amino acid mutations for robustness

  # Structure features
  use_structure_features: true
  structure_feature_dim: 128

# Model-based constraints (PiFold integration)
pifold:
  enabled: true
  checkpoint_path: "PiFold/checkpoints/pifold_cath42.pt"

  # Structure prediction
  predict_structure: true
  consistency_check: true
  rmsd_threshold: 2.0  # Angstroms

  # Feature extraction
  use_pifold_features: true
  freeze_pifold: false  # Whether to freeze PiFold during training

# Evaluation parameters
evaluation:
  metrics:
    - "recovery_rate"  # Sequence recovery percentage
    - "perplexity"     # Token prediction perplexity
    - "rmsd"           # Structure RMSD
    - "tm_score"       # Template modeling score

  # Benchmark datasets
  benchmarks:
    - "TS50"
    - "TS500"
    - "CATH42_test"

# Hardware
hardware:
  device: "cuda"
  num_gpus: 1
  mixed_precision: true
  pin_memory: true
  num_workers: 4

# Paths
paths:
  output_dir: "outputs"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  cache_dir: "cache"
